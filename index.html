<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>IT試験対策 2026</title>
  <style>
    :root { --bg-color:#ffffff; --text-color:#111111; --card-color:#f5f5f5; --border-color:#dddddd; --accent-color:#2563eb; --danger-color:#dc2626; --muted-color:#666666; --input-color:#ffffff; }
    body.dark { --bg-color:#121212; --text-color:#f0f0f0; --card-color:#1e1e1e; --border-color:#333333; --accent-color:#60a5fa; --danger-color:#f87171; --muted-color:#aaaaaa; --input-color:#181818; }
    *{box-sizing:border-box} body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background-color:var(--bg-color);color:var(--text-color);transition:background-color .2s,color .2s}
    header{position:sticky;top:0;z-index:100;background-color:var(--bg-color);border-bottom:1px solid var(--border-color);padding:12px} h1{margin:0 0 12px 0;font-size:22px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center} input[type="text"],input[type="password"],select{flex:1;min-width:120px;padding:10px;border-radius:8px;border:1px solid var(--border-color);background-color:var(--input-color);color:var(--text-color);font-size:14px}
    button{padding:10px 14px;border:none;border-radius:8px;background-color:var(--accent-color);color:white;font-size:14px;cursor:pointer} button:disabled{opacity:.6;cursor:not-allowed}.theme-btn{background-color:#555}.container{padding:12px}
    .login-box{max-width:560px;margin:40px auto;padding:18px;border:1px solid var(--border-color);border-radius:14px;background-color:var(--card-color)}.login-box h2{margin-top:0;font-size:20px}.login-box p{color:var(--muted-color);line-height:1.6;font-size:14px}.login-row{display:flex;gap:8px;align-items:center}.message{margin-top:12px;color:var(--danger-color);font-size:14px;white-space:pre-wrap}
    .stats{margin-bottom:12px;font-size:14px;opacity:.9}.card{background-color:var(--card-color);border:1px solid var(--border-color);border-radius:12px;padding:14px;margin-bottom:12px}.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}.category{font-size:12px;opacity:.8}.word{font-size:22px;font-weight:bold;margin:10px 0;word-break:break-word}.description{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-color);line-height:1.6;display:none;white-space:pre-wrap}.show{display:block}.toggle-desc{margin-top:8px;width:100%}.fuan-label{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}.fuan-on{color:var(--danger-color);font-weight:bold}.hidden{display:none}
    @media (max-width:600px){.toolbar,.login-row{flex-direction:column;align-items:stretch}button{width:100%}}
  </style>
</head>
<body>
<header>
  <h1>IT試験対策 2026</h1>
  <div class="toolbar hidden" id="mainToolbar"><input type="text" id="searchBox" placeholder="用語検索"><select id="categoryFilter"><option value="">すべてのカテゴリ</option></select><button id="allBtn">全件</button><button id="fuanBtn">不安のみ</button><button class="theme-btn" id="themeBtn">🌙 Dark</button></div>
  <div class="toolbar" id="loginToolbar"><button class="theme-btn" id="themeBtnLogin">🌙 Dark</button></div>
</header>
<div class="container">
  <div class="login-box" id="loginBox"><h2>パスワード入力</h2><p>暗号化済みデータ <strong>exam2026.enc</strong> を読み込みます。<br>正しいパスワードを入力した場合のみ、用語一覧を表示します。</p><div class="login-row"><input type="password" id="passwordInput" placeholder="パスワード"><button id="unlockBtn">表示する</button></div><div class="message" id="loginMessage"></div></div>
  <div id="mainArea" class="hidden"><div class="stats" id="stats"></div><div id="wordList"></div></div>
</div>
<script>
  const ENC_FILE='exam2026.enc';let allData=[];let showFuanOnly=false;
  const wordList=document.getElementById('wordList'),searchBox=document.getElementById('searchBox'),categoryFilter=document.getElementById('categoryFilter'),stats=document.getElementById('stats'),themeBtn=document.getElementById('themeBtn'),themeBtnLogin=document.getElementById('themeBtnLogin'),loginBox=document.getElementById('loginBox'),mainArea=document.getElementById('mainArea'),mainToolbar=document.getElementById('mainToolbar'),loginToolbar=document.getElementById('loginToolbar'),passwordInput=document.getElementById('passwordInput'),unlockBtn=document.getElementById('unlockBtn'),loginMessage=document.getElementById('loginMessage');
  async function unlockData(){loginMessage.textContent='';const password=passwordInput.value;if(!password){loginMessage.textContent='パスワードを入力してください。';return}try{unlockBtn.disabled=true;unlockBtn.textContent='読み込み中...';const response=await fetch(ENC_FILE+'?v='+new Date().getTime());if(!response.ok)throw new Error('exam2026.enc を取得できません。');const encryptedText=await response.text();const csvText=await decryptText(encryptedText.trim(),password);allData=parseCSV(csvText);buildCategoryFilter();loginBox.classList.add('hidden');loginToolbar.classList.add('hidden');mainToolbar.classList.remove('hidden');mainArea.classList.remove('hidden');render()}catch(error){loginMessage.textContent='表示できませんでした。\nパスワードが違う、または exam2026.enc が壊れている可能性があります。'}finally{unlockBtn.disabled=false;unlockBtn.textContent='表示する'}}
  async function decryptText(encryptedBase64,password){const payload=JSON.parse(atob(encryptedBase64));const salt=base64ToArrayBuffer(payload.salt),iv=base64ToArrayBuffer(payload.iv),encryptedData=base64ToArrayBuffer(payload.data);const keyMaterial=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),{name:'PBKDF2'},false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']);const decryptedBuffer=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,encryptedData);return new TextDecoder().decode(decryptedBuffer)}
  function parseCSV(text){const rows=parseCSVText(text);if(rows.length<2)throw new Error('CSVにデータがありません。');const headers=rows[0].map(x=>x.trim().replace(/^\uFEFF/,''));const noIndex=headers.indexOf('No'),wordIndex=headers.indexOf('用語'),categoryIndex=headers.indexOf('カテゴリ'),descriptionIndex=headers.indexOf('説明');if(noIndex===-1||wordIndex===-1||categoryIndex===-1||descriptionIndex===-1)throw new Error('CSVヘッダーは No,用語,カテゴリ,説明 にしてください。');return rows.slice(1).filter(row=>row.length>=4&&row[wordIndex]).map(row=>({no:String(row[noIndex]||'').trim(),word:String(row[wordIndex]||'').trim(),category:String(row[categoryIndex]||'').trim(),description:String(row[descriptionIndex]||'').trim()}))}
  function parseCSVText(text){const rows=[];let row=[],current='',insideQuotes=false;text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){const char=text[i],next=text[i+1];if(char==='"'&&insideQuotes&&next==='"'){current+='"';i++}else if(char==='"'){insideQuotes=!insideQuotes}else if(char===','&&!insideQuotes){row.push(current);current=''}else if((char==='\n'||char==='\r')&&!insideQuotes){if(char==='\r'&&next==='\n')i++;row.push(current);rows.push(row);row=[];current=''}else{current+=char}}if(current!==''||row.length>0){row.push(current);rows.push(row)}return rows}
  function buildCategoryFilter(){const categories=[...new Set(allData.map(x=>x.category).filter(Boolean))].sort();categoryFilter.innerHTML='<option value="">すべてのカテゴリ</option>';categories.forEach(cat=>{const option=document.createElement('option');option.value=cat;option.textContent=cat;categoryFilter.appendChild(option)})}
  function isFuan(no){return localStorage.getItem('fuan_'+no)==='true'}function setFuan(no,value){localStorage.setItem('fuan_'+no,value)}
  function render(){const keyword=searchBox.value.toLowerCase(),category=categoryFilter.value;let filtered=allData.filter(item=>{const word=String(item.word||'').toLowerCase(),description=String(item.description||'').toLowerCase(),itemCategory=String(item.category||'').toLowerCase();const matchKeyword=word.includes(keyword)||description.includes(keyword)||itemCategory.includes(keyword);const matchCategory=category===''||item.category===category;const matchFuan=!showFuanOnly||isFuan(item.no);return matchKeyword&&matchCategory&&matchFuan});const fuanCount=allData.filter(item=>isFuan(item.no)).length;stats.innerHTML=`表示件数：${filtered.length} / ${allData.length}　不安：${fuanCount}`;wordList.innerHTML='';filtered.forEach(item=>{const card=document.createElement('div');card.className='card';const checked=isFuan(item.no)?'checked':'',fuanClass=isFuan(item.no)?'fuan-on':'';card.innerHTML=`<div class="card-header"><div><div>No.${escapeHtml(item.no)}</div><div class="category">${escapeHtml(item.category)}</div></div><label class="fuan-label ${fuanClass}"><input type="checkbox" class="fuan-check" data-no="${escapeHtml(item.no)}" ${checked}>不安</label></div><div class="word">${escapeHtml(item.word)}</div><button class="toggle-desc">説明を表示</button><div class="description">${escapeHtml(item.description)}</div>`;const btn=card.querySelector('.toggle-desc'),desc=card.querySelector('.description'),checkbox=card.querySelector('.fuan-check'),label=card.querySelector('.fuan-label');btn.addEventListener('click',()=>{desc.classList.toggle('show');btn.textContent=desc.classList.contains('show')?'説明を閉じる':'説明を表示'});checkbox.addEventListener('change',()=>{setFuan(item.no,checkbox.checked);if(checkbox.checked){label.classList.add('fuan-on')}else{label.classList.remove('fuan-on');if(showFuanOnly){render();return}}const fuanCount=allData.filter(item=>isFuan(item.no)).length;stats.innerHTML=`表示件数：${wordList.children.length} / ${allData.length}　不安：${fuanCount}`});wordList.appendChild(card)})}
  function escapeHtml(text){return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function base64ToArrayBuffer(base64){const binary=atob(base64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++){bytes[i]=binary.charCodeAt(i)}return bytes.buffer}
  document.getElementById('allBtn').addEventListener('click',()=>{showFuanOnly=false;render()});document.getElementById('fuanBtn').addEventListener('click',()=>{showFuanOnly=true;render()});unlockBtn.addEventListener('click',unlockData);passwordInput.addEventListener('keydown',event=>{if(event.key==='Enter')unlockData()});searchBox.addEventListener('input',render);categoryFilter.addEventListener('change',render);
  function applyTheme(theme){if(theme==='dark'){document.body.classList.add('dark');themeBtn.textContent='☀ Light';themeBtnLogin.textContent='☀ Light'}else{document.body.classList.remove('dark');themeBtn.textContent='🌙 Dark';themeBtnLogin.textContent='🌙 Dark'}}function toggleTheme(){const current=localStorage.getItem('theme')||'light',next=current==='light'?'dark':'light';localStorage.setItem('theme',next);applyTheme(next)}themeBtn.addEventListener('click',toggleTheme);themeBtnLogin.addEventListener('click',toggleTheme);function initializeTheme(){const savedTheme=localStorage.getItem('theme');if(savedTheme){applyTheme(savedTheme);return}const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;applyTheme(prefersDark?'dark':'light')}initializeTheme();
</script>
</body>
</html>
